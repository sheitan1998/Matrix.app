name: Generate Tauri Keys

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tauri CLI and generate keys
        run: |
          echo "=== GENERATING TAURI KEYS ==="
          npx @tauri-apps/cli signer generate -f -w ./matrix.key
          echo "--- PRIVATE KEY (Add this to GitHub Secrets TAURI_SIGNING_PRIVATE_KEY) ---"
          cat ./matrix.key
          echo ""
          echo "--- PUBLIC KEY (Add this to tauri.conf.json under pubkey) ---"
          cat ./matrix.key.pub
