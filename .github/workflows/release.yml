name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to create or update (for example v1.0.3)
        required: true
        type: string
      ref:
        description: Git ref, branch, or commit to build from
        required: false
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri App & Create Installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || 'v__VERSION__' }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && format('Matrix {0}', github.event.inputs.release_tag) || 'Matrix v__VERSION__' }}
          releaseBody: 'Nouvelle mise à jour de Matrix.'
          releaseDraft: false
          prerelease: false
