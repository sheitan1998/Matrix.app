name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref, branch, or commit to build from'
        required: true
        default: 'main'
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri App & Create Installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Matrix v__VERSION__'
          releaseBody: 'Nouvelle mise à jour de Matrix.'
          releaseDraft: false
          prerelease: false

      - name: Verify updater artifacts
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/release/bundle"
          if (-not (Test-Path $bundleRoot)) {
            Write-Error "Bundle folder not found: $bundleRoot"
            exit 1
          }

          $latestJson = @(Get-ChildItem -Path $bundleRoot -Recurse -File -Include "latest.json" -ErrorAction SilentlyContinue)
          if ($latestJson.Count -eq 0) {
            Write-Error "Updater metadata latest.json not found in bundle output."
            exit 1
          }

          $signatures = @(Get-ChildItem -Path $bundleRoot -Recurse -File -Filter "*.sig" -ErrorAction SilentlyContinue)
          if ($signatures.Count -eq 0) {
            Write-Error "No signature files (*.sig) found in bundle output."
            exit 1
          }

          Write-Host "Found updater metadata:"
          $latestJson | ForEach-Object { Write-Host " - $($_.FullName)" }
          Write-Host "Found signature files: $($signatures.Count)"
