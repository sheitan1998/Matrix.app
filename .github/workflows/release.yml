name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref, branch, or commit to build from'
        required: true
        default: 'main'
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release metadata
        id: release-metadata
        shell: pwsh
        run: |
          $tauriConfig = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $tauriConfig.version
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME) {
            $env:GITHUB_REF_NAME
          } else {
            "v$version"
          }

          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Remove existing assets from target release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-metadata.outputs.release_tag }}
        run: |
          . ./scripts/github-release-assets.ps1
          $headers = New-GitHubReleaseHeaders -Token $env:GITHUB_TOKEN

          function ShouldDeleteReleaseAsset([object]$Asset) {
            if (-not $Asset -or -not $Asset.name) {
              return $false
            }

            $assetName = [string]$Asset.name
            return (
              $assetName -eq "latest.json" -or
              $assetName -eq "Matrix-Setup.msi" -or
              $assetName -eq "Matrix-Setup.exe" -or
              $assetName -like "*.msi" -or
              $assetName -like "*.msi.sig" -or
              $assetName -like "*-setup.exe" -or
              $assetName -like "*-setup.exe.sig"
            )
          }

          $release = Get-GitHubReleaseByTag -Repository $env:GITHUB_REPOSITORY -Headers $headers -TagName $env:RELEASE_TAG
          if (-not $release) {
            Write-Host "No existing release found for tag '$env:RELEASE_TAG'; nothing to clean."
            exit 0
          }

          $assets = @(Get-GitHubReleaseAssets -Repository $env:GITHUB_REPOSITORY -Headers $headers -ReleaseId $release.id | Where-Object { ShouldDeleteReleaseAsset $_ })
          if ($assets.Count -eq 0) {
            Write-Host "Release '$env:RELEASE_TAG' exists but has no Windows-owned assets to delete."
            exit 0
          }

          foreach ($asset in $assets) {
            Remove-GitHubReleaseAsset -Repository $env:GITHUB_REPOSITORY -Headers $headers -Asset $asset -Reason "before rebuild"
          }

          Write-Host "Removed $($assets.Count) existing Windows-owned asset(s) from release '$env:RELEASE_TAG'."

      - name: Build Tauri App & Create Installer
        id: tauri-build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Matrix v__VERSION__'
          releaseBody: 'Nouvelle mise à jour de Matrix.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true

      - name: Generate latest.json for matrix-hub updater
        shell: pwsh
        env:
          TAURI_APP_VERSION: ${{ steps.release-metadata.outputs.app_version }}
        run: |
          node scripts/generate-latest-json.mjs --version=$env:TAURI_APP_VERSION --base-url=https://matrix-hub.app/downloads

      - name: Upload generated latest.json in release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-metadata.outputs.release_tag }}
          TAURI_RELEASE_ID: ${{ steps.tauri-build.outputs.releaseId }}
        run: |
          . ./scripts/github-release-assets.ps1
          $headers = New-GitHubReleaseHeaders -Token $env:GITHUB_TOKEN
          $releaseId = Get-GitHubReleaseId -Repository $env:GITHUB_REPOSITORY -Headers $headers -TagName $env:RELEASE_TAG -ReleaseId $env:TAURI_RELEASE_ID
          if (-not $releaseId) {
            Write-Error "Missing tauri release id and no release was found for tag '$env:RELEASE_TAG'."
            exit 1
          }

          $assetName = "latest.json"
          Remove-GitHubReleaseAssetsByName -Repository $env:GITHUB_REPOSITORY -Headers $headers -ReleaseId $releaseId -AssetNames @($assetName)

          $uploadHeaders = New-GitHubReleaseHeaders -Token $env:GITHUB_TOKEN -ContentType "application/octet-stream"
          $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?name=$([System.Uri]::EscapeDataString($assetName))"
          Invoke-RestMethod -Uri $uploadUrl -Headers $uploadHeaders -Method Post -InFile $assetName -ErrorAction Stop

      - name: Publish stable installer aliases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-metadata.outputs.release_tag }}
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
          TAURI_RELEASE_ID: ${{ steps.tauri-build.outputs.releaseId }}
        run: |
          . ./scripts/github-release-assets.ps1
          $headers = New-GitHubReleaseHeaders -Token $env:GITHUB_TOKEN

          $candidateRoots = New-Object System.Collections.Generic.List[string]

          foreach ($root in @(
            "src-tauri/target/release/bundle",
            "src-tauri/target/release",
            "target/release/bundle",
            "target/release"
          )) {
            if (Test-Path $root) {
              $candidateRoots.Add((Resolve-Path $root).Path)
            }
          }

          if ($env:TAURI_ARTIFACT_PATHS) {
            try {
              $artifactPaths = @(ConvertFrom-Json -InputObject $env:TAURI_ARTIFACT_PATHS)
              foreach ($artifactPath in $artifactPaths) {
                if (-not $artifactPath) {
                  continue
                }

                foreach ($candidate in @(
                  ((Test-Path $artifactPath -PathType Container) ? $artifactPath : $null),
                  (Split-Path -Parent $artifactPath),
                  ((Split-Path -Parent $artifactPath) ? (Split-Path -Parent (Split-Path -Parent $artifactPath)) : $null)
                )) {
                  if ($candidate -and (Test-Path $candidate)) {
                    $candidateRoots.Add((Resolve-Path $candidate).Path)
                  }
                }
              }
            } catch {
              Write-Warning "Unable to parse tauri-action artifactPaths output while locating installers: $($_.Exception.Message)"
            }
          }

          $candidateRoots = @($candidateRoots | Sort-Object -Unique)
          if ($candidateRoots.Count -eq 0) {
            Write-Error "No Tauri build output directory found while locating Windows installers."
            exit 1
          }

          Write-Host "Searching Windows installers under:"
          $candidateRoots | ForEach-Object { Write-Host " - $_" }

          $msiInstallers = @(
            foreach ($root in $candidateRoots) {
              Get-ChildItem -Path $root -Recurse -File -Filter "*.msi" -ErrorAction SilentlyContinue | Where-Object {
                $_.FullName -match '[\\/](bundle[\\/])?msi[\\/]'
              }
            }
          )
          $msiInstallers = @($msiInstallers | Sort-Object FullName -Unique)

          $exeInstallers = @(
            foreach ($root in $candidateRoots) {
              Get-ChildItem -Path $root -Recurse -File -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object {
                $_.Name -like "*setup.exe" -and $_.FullName -match '[\\/](bundle[\\/])?nsis[\\/]'
              }
            }
          )
          $exeInstallers = @($exeInstallers | Sort-Object FullName -Unique)

          if ($msiInstallers.Count -eq 0) {
            Write-Error "No Windows MSI installer (*.msi) was found in the Tauri build outputs."
            exit 1
          }

          if ($exeInstallers.Count -eq 0) {
            Write-Error "No Windows NSIS installer (*setup.exe) was found in the Tauri build outputs."
            exit 1
          }

          if ($msiInstallers.Count -gt 1) {
            Write-Warning "Multiple MSI installers found; using the first deterministic match:"
            $msiInstallers | ForEach-Object { Write-Warning " - $($_.FullName)" }
          }

          if ($exeInstallers.Count -gt 1) {
            Write-Warning "Multiple NSIS installers found; using the first deterministic match:"
            $exeInstallers | ForEach-Object { Write-Warning " - $($_.FullName)" }
          }

          $releaseId = Get-GitHubReleaseId -Repository $env:GITHUB_REPOSITORY -Headers $headers -TagName $env:RELEASE_TAG -ReleaseId $env:TAURI_RELEASE_ID
          if (-not $releaseId) {
            Write-Error "Missing tauri release id and no release was found for tag '$env:RELEASE_TAG'."
            exit 1
          }

          $aliasUploads = @(
            @{
              AssetName = "Matrix-Setup.msi"
              SourcePath = $msiInstallers[0].FullName
              ContentType = "application/x-msi"
            },
            @{
              AssetName = "Matrix-Setup.exe"
              SourcePath = $exeInstallers[0].FullName
              ContentType = "application/octet-stream"
            }
          )

          $releaseAssets = @(Get-GitHubReleaseAssets -Repository $env:GITHUB_REPOSITORY -Headers $headers -ReleaseId $releaseId)
          foreach ($aliasUpload in $aliasUploads) {
            $existingAliasAssets = @($releaseAssets | Where-Object { $_.name -eq $aliasUpload.AssetName })
            foreach ($asset in $existingAliasAssets) {
              Remove-GitHubReleaseAsset -Repository $env:GITHUB_REPOSITORY -Headers $headers -Asset $asset
            }
            $releaseAssets = @($releaseAssets | Where-Object { $_.name -ne $aliasUpload.AssetName })

            $uploadHeaders = New-GitHubReleaseHeaders -Token $env:GITHUB_TOKEN -ContentType $aliasUpload.ContentType
            $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?name=$([System.Uri]::EscapeDataString($aliasUpload.AssetName))"
            Invoke-RestMethod -Uri $uploadUrl -Headers $uploadHeaders -Method Post -InFile $aliasUpload.SourcePath -ErrorAction Stop
            Write-Host "Published stable release asset '$($aliasUpload.AssetName)' from '$($aliasUpload.SourcePath)'."
            Write-Host "Stable direct download URL: https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/$($aliasUpload.AssetName)"
          }

      - name: Verify updater artifacts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-metadata.outputs.release_tag }}
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
          TAURI_RELEASE_ID: ${{ steps.tauri-build.outputs.releaseId }}
        run: |
          . ./scripts/github-release-assets.ps1
          $candidateRoots = New-Object System.Collections.Generic.List[string]

          foreach ($root in @(
            "src-tauri/target/release/bundle",
            "src-tauri/target/release",
            "target/release/bundle",
            "target/release"
          )) {
            if (Test-Path $root) {
              $candidateRoots.Add((Resolve-Path $root).Path)
            }
          }

          if ($env:TAURI_ARTIFACT_PATHS) {
            try {
              $artifactPaths = @(ConvertFrom-Json -InputObject $env:TAURI_ARTIFACT_PATHS)
              foreach ($artifactPath in $artifactPaths) {
                if (-not $artifactPath) {
                  continue
                }

                foreach ($candidate in @(
                  ((Test-Path $artifactPath -PathType Container) ? $artifactPath : $null),
                  (Split-Path -Parent $artifactPath),
                  ((Split-Path -Parent $artifactPath) ? (Split-Path -Parent (Split-Path -Parent $artifactPath)) : $null)
                )) {
                  if ($candidate -and (Test-Path $candidate)) {
                    $candidateRoots.Add((Resolve-Path $candidate).Path)
                  }
                }
              }
            } catch {
              Write-Warning "Unable to parse tauri-action artifactPaths output: $($_.Exception.Message)"
            }
          }

          $candidateRoots = @($candidateRoots | Sort-Object -Unique)
          if ($candidateRoots.Count -eq 0 -and -not $env:TAURI_RELEASE_ID) {
            Write-Error "No Tauri build output directory found to verify updater artifacts."
            exit 1
          }

          if ($candidateRoots.Count -gt 0) {
            Write-Host "Inspecting updater artifacts under:"
            $candidateRoots | ForEach-Object { Write-Host " - $_" }
          } else {
            Write-Warning "No local Tauri output directories found; falling back to uploaded release assets."
          }

          $latestJson = @()
          $signatures = @()

          foreach ($root in $candidateRoots) {
            $latestJson += @(Get-ChildItem -Path $root -Recurse -File -Filter "latest.json" -ErrorAction SilentlyContinue)
            $signatures += @(Get-ChildItem -Path $root -Recurse -File -Filter "*.sig" -ErrorAction SilentlyContinue)
          }

          $latestJson = @($latestJson | Sort-Object FullName -Unique)
          $signatures = @($signatures | Sort-Object FullName -Unique)

          if ($latestJson.Count -gt 0) {
            Write-Host "Found local latest.json:"
            $latestJson | ForEach-Object { Write-Host " - $($_.FullName)" }
          }

          if ($signatures.Count -gt 0) {
            Write-Host "Found local signature files:"
            $signatures | ForEach-Object { Write-Host " - $($_.FullName)" }
          }

          $releaseAssets = @()
          if ($latestJson.Count -eq 0 -or $signatures.Count -eq 0) {
            $headers = New-GitHubReleaseHeaders -Token $env:GITHUB_TOKEN
            $releaseId = Get-GitHubReleaseId -Repository $env:GITHUB_REPOSITORY -Headers $headers -TagName $env:RELEASE_TAG -ReleaseId $env:TAURI_RELEASE_ID
            if ($releaseId) {
              Write-Host "Local updater artifacts incomplete, checking uploaded release assets for release id $releaseId."
              try {
                $releaseAssets = @(Get-GitHubReleaseAssets -Repository $env:GITHUB_REPOSITORY -Headers $headers -ReleaseId $releaseId)
              } catch {
                Write-Warning "Unable to inspect uploaded release assets: $($_.Exception.Message)"
              }
            } else {
              Write-Warning "Release id is unavailable while verifying fallback release assets."
            }
          }

          $latestJsonAssets = @($releaseAssets | Where-Object { $_.name -eq "latest.json" })
          $signatureAssets = @($releaseAssets | Where-Object { $_.name -like "*.sig" })

          if ($latestJson.Count -eq 0 -and $latestJsonAssets.Count -gt 0) {
            Write-Host "Found release asset latest.json:"
            $latestJsonAssets | ForEach-Object { Write-Host " - $($_.browser_download_url)" }
          }

          if ($signatures.Count -eq 0 -and $signatureAssets.Count -gt 0) {
            Write-Host "Found release asset signatures:"
            $signatureAssets | ForEach-Object { Write-Host " - $($_.browser_download_url)" }
          }

          if ($latestJson.Count -eq 0 -and $latestJsonAssets.Count -eq 0) {
            Write-Error "Updater metadata latest.json not found in Tauri outputs or uploaded release assets."
            exit 1
          }

          if ($signatures.Count -eq 0 -and $signatureAssets.Count -eq 0) {
            Write-Error "No signature files (*.sig) found in Tauri outputs or uploaded release assets."
            exit 1
          }

          Write-Host "Updater artifact verification passed."
